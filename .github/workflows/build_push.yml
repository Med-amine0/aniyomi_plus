name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aniyomi-plus-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      # Create release for tags (works for forks)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Aniyomi Plus ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## Aniyomi Plus Fork

            Built on **Aniyomi 0.18.2.1**.

            ### New from upstream
            - **Extension stores** - the extension repository list is now a protobuf/gzip store index (aniyomix 1.6), migrated automatically from the legacy index
            - **extensions-lib v17** - related entries, hoster/video memo, an in-app HTTP server for extensions, seek thumbnails, new `source-api` models
            - **Upstream torrent streaming**, merged in alongside this fork's implementation

            ### Fork features (unchanged)
            - Dashboard tab with AniList API discovery - genre pills, tags dropdown, anime & movie rows, in-app search
            - Nested (hierarchical) categories
            - Configurable library columns via slider
            - Dash debug panel in **More > Dash**
            - Torrent streaming

            ### Torrent Streaming
            Embedded TorrServer - no external server needed.

            1. **Turn it on first:** More > Settings > Player > Torrents > *Enable torrent streaming* (off by default)
            2. Adjust the port and custom trackers on that same screen if you need to
            3. Play a magnet link or `.torrent` file - the server starts automatically

            **Fixed in this release** - torrent playback no longer fails with mpv's
            "unrecognized file format". The torrent engine was restored to the
            pre-merge implementation (Diegopyl1209 `torrentserver-aniyomi`), along
            with the original stream host and file-index handling.

            **Known limitation** - *Proxy mode* and *Proxy URL* on the Torrents screen
            are stored but not used by the current torrent engine.

            ### Install
            Download the `.apk` from the **Assets** section below and install it over
            your current build. Release builds are signed with the fork's key, so this
            is an in-place update.

            ### API
            Uses the [AniList GraphQL API](https://github.com/AniList/docs) for anime discovery.

            ### Credits
            - [Animetail](https://github.com/nerdXD/Animetail) - TorrServer implementation reference
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
