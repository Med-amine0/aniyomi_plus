name: CI

permissions:
  contents: write

on:
  push:
    branches:
      - '*'
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Upload Release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aniyomi-plus-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release

      # Create release for tags (works for forks)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Aniyomi Plus ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## Aniyomi Plus Fork

            Built on **Aniyomi 0.18.2.1**.

            ### New from upstream
            - **Extension stores** - the manga extension repository list can be a protobuf/gzip store index (aniyomix 1.6), migrated automatically from the legacy index
            - **extensions-lib v17** - related entries, hoster/video memo, an in-app HTTP server for extensions, seek thumbnails, new `source-api` models
            - **Upstream torrent streaming**, merged in alongside this fork's implementation

            ### Manga extensions are current now (Keiyoushi)
            - **extensions-lib 1.6** - sources that supply details and chapters
              through the combined `getMangaUpdate(manga, chapters, fetchDetails,
              fetchChapters)` hook (Keiyoushi's `KeiSource`) work, `SMangaUpdate`
              included. Sources built for lib 1.4 / 1.5 behave exactly as before.
            - **Extension stores** - *Manga extension repos* accepts protobuf
              `index.pb`, `repo.json` and legacy `index.min.json`, merged into a
              single extension list; deleting works for both kinds.
            - Add Keiyoushi: **Settings > Browse > Manga extension repos > +**
              then `https://raw.githubusercontent.com/keiyoushi/extensions/repo/index.min.json`
              (or `.../index.pb`, or the "add to app" button on the Keiyoushi site).
            - Anime stores already worked the same way - *Anime extension repos*,
              same URL shapes, anime extensions lib v14 / v16 / v17.

            ### Fixed
            - **Entry memo support** - the `memo` field of manga and chapters supplied
              by extensions-lib 1.6 sources is now stored in the database (schema
              migration 35). Existing backups and restores are unchanged.
            - **Faster cold start** - the Dach and More tabs now dismiss the splash
              screen as soon as they are ready instead of holding it for the full
              5 seconds (measured 5.6s -> ~1.1s on a Galaxy S23+).
            - Random crash with no crash screen while loading an entry: R8 stripped
              `com.squareup.zstd.**` while the bundled native `libzstd-kmp.so`
              resolved those classes by name, so any `Content-Encoding: zstd`
              response aborted the app from native code.
            - Manga entries failing to load on 1.6 sources (`AbstractMethodError`);
              details and chapters are fetched sequentially now, because 1.6
              sources reject concurrent updates for the same manga.

            ### Fork features
            - Dashboard tab with AniList API discovery - genre pills, tags
              dropdown, anime & movie rows, in-app search
            - Nested (hierarchical) categories
            - Configurable library columns
            - Dash debug panel in **More > Dash**
            - Torrent streaming (TorrServer - details below)

            ### Torrent Streaming
            Embedded TorrServer - no external server needed.

            1. **Turn it on first:** More > Settings > Player > Torrents > *Enable torrent streaming* (off by default)
            2. Adjust the port and custom trackers on that same screen if you need to
            3. Play a magnet link or `.torrent` file - the server starts automatically

            **Fixed** - torrent playback no longer fails with mpv's "unrecognized
            file format". The torrent engine was restored to the pre-merge
            implementation (Diegopyl1209 `torrentserver-aniyomi`), along with the
            original stream host and file-index handling.

            **Known limitation** - *Proxy mode* and *Proxy URL* on the Torrents screen
            are stored but not used by the current torrent engine.

            ### Install
            Grab the `.apk` from **Assets** below and install it over your current
            build. Release builds are signed with the fork's key, so this is an
            in-place update - library, categories and settings are kept.

            ### API
            Uses the [AniList GraphQL API](https://github.com/AniList/docs) for anime discovery.

            ### Credits
            - [Aniyomi](https://github.com/aniyomiorg/aniyomi) - the base app
            - [Mihon](https://github.com/mihonapp/mihon) / [Tachiyomi](https://github.com/tachiyomiorg/tachiyomi) - `source-api` and the extension-store design
            - [Keiyoushi](https://github.com/keiyoushi/extensions) - manga extension catalogue and `KeiSource`
            - [torrentserver-aniyomi](https://github.com/Diegopyl1209/torrentserver-aniyomi) / [TorrServer](https://github.com/YouROK/TorrServer) - torrent streaming
            - [Animetail](https://github.com/Animetailapp/Animetail) - TorrServer integration reference
            - [AniList](https://github.com/AniList/docs) - discovery API

            Full details: https://github.com/Med-amine0/aniyomi_plus#whats-new-in-this-fork
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
